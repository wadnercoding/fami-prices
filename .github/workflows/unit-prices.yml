name: Unit prices

on:
  schedule:
    # Offset from the hour so the run is not dropped with the :00 and :15 crowd.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append the latest prints
        run: python3 tools/unit_prices.py unit_prices.json

      - name: Publish the ledger
        run: |
          set -euo pipefail
          if [ ! -f unit_prices.json ]; then
            echo "Yahoo did not return a price. The ledger stays as it was."
            exit 0
          fi
          git add unit_prices.json
          if git diff --cached --quiet; then
            echo "No new print."
            exit 0
          fi
          git -c user.name="wadnercoding" -c user.email="wadnercoding@users.noreply.github.com" commit -m "Append the latest coin prices."
          git push
